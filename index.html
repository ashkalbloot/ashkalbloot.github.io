<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="صفحة دعم تطبيق أشكل وروابطه الرسمية.">
  <title>أشكل — دعم التطبيق</title>
  <style>
    :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; color: #302d24; background: #f3eee4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; line-height: 1.9; }
    main { width: 100%; max-width: 580px; padding: clamp(22px, 5vw, 40px); border: 1px solid #d2c5ad; border-radius: 20px; background: #fffdf7; box-shadow: 0 12px 40px #3b352012; }
    .label { display: inline-block; margin: 0 0 12px; padding: 3px 11px; border-radius: 20px; background: #e7eee5; color: #31533b; font-size: 13px; }
    h1 { margin: 0 0 6px; font-size: clamp(30px, 8vw, 42px); line-height: 1.5; color: #284b34; }
    h2 { margin: 25px 0 8px; font-size: 19px; }
    p { margin: 0 0 14px; }
    .intro { color: #665d4b; }
    a { color: #244e33; text-underline-offset: 4px; overflow-wrap: anywhere; }
    .store-link { display: inline-block; margin-top: 4px; padding: 11px 17px; border: 1px solid #315b3f; border-radius: 10px; background: #315b3f; color: #fffdf7; text-decoration: none; font-weight: bold; }
    .store-link:hover { background: #24482f; }
    a:focus-visible { outline: 3px solid #a9792c; outline-offset: 5px; }
    footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid #e2d8c5; color: #726753; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <p class="label">دعم التطبيق</p>
    <h1>أشكل</h1>
    <p class="intro">تطبيق البلوت على الجوال.</p>
    <h2>تحتاج مساعدة؟</h2>
    <p>للمساعدة في الحساب أو استخدام التطبيق، افتح صفحة أشكل على Google Play وراجع قسم «دعم التطبيق» للوصول إلى وسائل التواصل المتاحة.</p>
    <a class="store-link" href="https://play.google.com/store/apps/details?id=com.unlimitedgam.ashkal">صفحة أشكل على Google Play</a>
    <p><a href="https://ashkal-b616a.web.app/ashkal-privacy.html">سياسة الخصوصية</a></p>
    <footer>صفحة معلومات ودعم لتطبيق أشكل.</footer>
  </main>
</body>
</html>
